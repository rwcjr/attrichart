name: Bug report
description: Something renders wrong, computes wrong, or throws
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: '@attrichart/core 0.1.0'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected versus what you got. Screenshots help for rendering issues.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest stages plus records dataset and options that reproduce the problem.
      render: js
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Chrome 126, Vue 3.4 + Vuetify 3.6, Nuxt 3'
