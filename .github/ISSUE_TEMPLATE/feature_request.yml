name: Feature request
description: Propose an option, behavior, or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the API could look like. Sketches of option names or data shapes welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
